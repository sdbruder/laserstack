services:
  app:
    image: "laserstack/app:${PHP_VERSION}"
    # build:
    #   context: ./docker/app
    #   dockerfile: Dockerfile
    cap_add:
      - SYS_ADMIN
    hostname: laser
    environment:
      LASER: 1
      SUFFIX: "${SUFFIX}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    tty: true
    ports:
      - 80:80
    working_dir: /var/www
    volumes:
      - ${PROJECTS_DIRECTORY}:/var/www:cached
      - ./config/supervisord.${PHP_VERSION}/supervisord.conf:/etc/supervisord.conf:cached
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:cached
      # This mount replaces all vhosts of the image. The image has
      # /etc/nginx/http.d/nginx-site.conf with "listen 80 default_server".
      # Therefore the only default server is the multi-project vhost of
      # laserstack. Supervisord renders that vhost into /etc/nginx/sites-enabled,
      # which is not a mount, so the config directory of the host stays clean.
      - ./config/nginx/http.d:/etc/nginx/http.d:cached
      - ./config/php${PHPV}/php.ini:/etc/php${PHPALPINE}/php.ini:cached
      - ./config/php${PHPV}/php-fpm.conf:/etc/php${PHPALPINE}/php-fpm.conf:cached
      - ./config/php${PHPV}/php-fpm.d:/etc/php${PHPALPINE}/php-fpm.d:cached
      # The database containers of the stack have no TLS and the client of the
      # newer images requires TLS by default, see config/my.cnf.
      - ./config/my.cnf:/etc/my.cnf.d/laserstack.cnf:cached
    networks:
      - laser
  db:
    image: "mysql:${MYSQL_VERSION:-8.0}"
    # the authentication plugin of the server version is in the mounted config
    # directory, see config/mysql/<version>/docker.cnf
    ports:
      - "3306:3306"
    volumes:
      - ./config/mysql/${MYSQL_VERSION:-8.0}:/etc/mysql/conf.d:cached
      - dbdata:/var/lib/mysql:delegated
    environment:
      LASER: 1
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    networks:
      - laser
    profiles:
      - mysql
  mariadb:
    image: "mariadb:${MARIADB_VERSION:-10.11}"
    ports:
      - "3306:3306"
    volumes:
      - ./config/mariadb/${MARIADB_VERSION:-10.11}/laserstack.cnf:/etc/mysql/conf.d/laserstack.cnf:cached
      - mariadata:/var/lib/mysql:delegated
    environment:
      LASER: 1
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
    networks:
      laser:
        # Projects created before the mariadb profile use "db" as the database
        # host, the name of the service of the mysql profile. Do not activate
        # both database profiles at the same time, both use port 3306.
        aliases:
          - db
    profiles:
      - mariadb
  postgres:
    image: "postgres:${POSTGRES_VERSION:-15.1}-alpine"
    # the server reads the config directory of its version, see
    # config/postgres/<version>
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - 5432:5432
    volumes:
      # postgres keeps its data in /var/lib/postgresql/data, not in
      # /var/lib/mysql like the mysql containers
      - pgdata:/var/lib/postgresql/data:delegated
      - ./config/postgres/${POSTGRES_VERSION:-15.1}:/etc/postgresql:cached
    environment:
      LASER: 1
      # postgres 18 moved PGDATA to /var/lib/postgresql/<major>/docker and
      # refuses to start with a data volume at the old path. The explicit value
      # is the upstream way to keep the path of the older versions, and it is
      # what they use as their default.
      PGDATA: /var/lib/postgresql/data
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      # POSTGRES_USER: '${POSTGRES_USER}'
      # POSTGRES_DB: '${POSTGRES_DB}'
      # POSTGRES_INITDB_ARGS: '${POSTGRES_INITDB_ARGS}'
      # POSTGRES_INITDB_WALDIR: '${POSTGRES_INITDB_WALDIR}'
      # POSTGRES_HOST_AUTH_METHOD: '${POSTGRES_HOST_AUTH_METHOD}'
    networks:
      - laser
    profiles:
      - postgres
  redis:
    image: "redis:${REDIS_VERSION:-8.10}-alpine"
    # the image starts "redis-server" without arguments, the mounted file is the
    # one setting the stack needs
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - 6379:6379
    volumes:
      - ./config/redis/${REDIS_VERSION:-8.10}:/usr/local/etc/redis:cached
    environment:
      LASER: 1
    networks:
      - laser
    profiles:
      - redis
  memcached:
    image: "memcached:${MEMCACHED_VERSION:-1.6}-alpine"
    ports:
      - 11211:11211
    environment:
      LASER: 1
    networks:
      - laser
    profiles:
      - memcached
  elasticsearch:
    image: "elasticsearch:${ELASTICSEARCH_VERSION:-7.14.2}"
    ports:
      - 9200:9200
      - 9300:9300
    volumes:
      # security is off, the file of the image is replaced, see
      # config/elasticsearch/<version>/elasticsearch.yml
      - ./config/elasticsearch/${ELASTICSEARCH_VERSION:-7.14.2}/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:cached
    environment:
      LASER: 1
      discovery.type: single-node
    networks:
      - laser
    profiles:
      - elasticsearch
      - full

volumes:
  dbdata:
    driver: local
  pgdata:
    driver: local
  mariadata:
    driver: local
networks:
  laser:
    driver: bridge
