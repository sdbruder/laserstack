; The pool of a worker container: the pool of a PHP version with one change,
; the address it listens on. 127.0.0.1 inside a worker is the worker itself,
; and the nginx that sends the requests of a project runs in the app
; container, so a worker listens on every address of its container.
;
; Every other line mirrors config/php<vv>/php-fpm.d/www.conf, which stays the
; pool of the app container. Keep the two in step when you change one of them:
; a project served by a worker must get the same pool as one served by the app
; container.
[www]
user = laser
group = laser

listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; the app container passes its environment to php-fpm, a worker does the same
clear_env = no

; No access.log and access.format on purpose. The spelling of the modifiers of
; that format changed between the series: 7.4 and 8.0 know %{mili}d, 8.5 wants
; %{milli}d, and php-fpm refuses to start on a format it does not know — which
; is a dead worker container, not a log line. The nginx of the app container
; logs every request with its upstream, so the log of the pool carries nothing
; a worker needs.
