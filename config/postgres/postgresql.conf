# laserstack mounts this file into the postgres container as
# /etc/postgresql/postgresql.conf and starts the server with
# "postgres -c config_file=/etc/postgresql/postgresql.conf".
#
# The values are the ones the official postgres image writes into the
# generated $PGDATA/postgresql.conf, so the file is readable and editable from
# the host without a surprise. Keep listen_addresses: the app container
# connects over TCP of the docker network.

listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 128MB
dynamic_shared_memory_type = posix
max_wal_size = 1GB
min_wal_size = 80MB
log_timezone = 'UTC'
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# Authentication stays in $PGDATA/pg_hba.conf, which the entrypoint writes.
